name: Documentation

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tools
        run: |
          python -m pip install -r docs/requirements.txt
          # Pinned: docs/conf.py post-processes Doxygen's XML, whose shape changes between releases.
          curl -fsSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen.tar.gz" | sha256sum -c -
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Mermaid renderer
        run: npm install --prefix build-docs/mermaid @mermaid-js/mermaid-cli@11.4.2
      - name: Build guide and API reference
        # Diagrams render to SVG here, so a Mermaid syntax error fails the build.
        env:
          CARTA_ZARR_MMDC: ${{ github.workspace }}/build-docs/mermaid/node_modules/.bin/mmdc
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: python -m sphinx -b html -W --keep-going docs build-docs/html
      - name: Upload rendered documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: build-docs/html
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/html

  # External sites fail for reasons unrelated to a change, so this never blocks a pull request:
  # run it from the Actions tab, or let the weekly schedule report broken links.
  linkcheck:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tools
        run: |
          python -m pip install -r docs/requirements.txt
          curl -fsSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen.tar.gz" | sha256sum -c -
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Check links
        run: python -m sphinx -b linkcheck docs build-docs/linkcheck

  deploy:
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
